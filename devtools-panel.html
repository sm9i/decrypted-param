<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>decrypted</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 20px;
        color: CanvasText;
        background: Canvas;
      }

      label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }

      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: Highlight;
      }

      .status {
        margin-left: 8px;
        color: GrayText;
        font-size: 12px;
      }

      .description {
        max-width: 680px;
        margin: 16px 0 0;
        color: GrayText;
        font-size: 13px;
        line-height: 1.65;
      }

      code {
        color: CanvasText;
      }

    </style>
  </head>
  <body>
    <label for="auto-hook">
      <input id="auto-hook" type="checkbox">
      自动注入 Hook
    </label>
    <span id="status" class="status" role="status"></span>
    <p class="description">
      开启后会拦截页面中的 <code>crypto.subtle.encrypt</code> 和
      <code>CryptoJS.AES.encrypt</code>，在 Console 输出加密前明文与加密结果；
      同时监听 Fetch/XHR 请求，并尝试匹配密文实际发送到的接口地址。首次开启或更新扩展后，
      请刷新目标页面，以便在混淆代码初始化前捕获 AES 对象。
    </p>
    <script src="devtools-panel.js"></script>
  </body>
</html>
